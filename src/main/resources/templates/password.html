<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改密碼 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        header { border-bottom: 3px solid #14B8A6; padding-bottom: 12px; margin-bottom: 24px; }
        h1 { color: #0F2443; margin: 0; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; }
        input[type="password"] { width: 100%; padding: 10px; border: 1px solid #CBD5E1; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        button { background: #14B8A6; color: white; padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; margin-top: 10px; }
        button:hover { background: #0D9488; }
        .alert-error { color: #B91C1C; background: #FEE2E2; padding: 12px; border-radius: 4px; margin-bottom: 16px; border-left: 4px solid #EF4444; }
        .alert-success { color: #047857; background: #D1FAE5; padding: 12px; border-radius: 4px; margin-bottom: 16px; border-left: 4px solid #10B981; }
        .back-link { display: block; text-align: center; margin-top: 24px; text-decoration: none; color: #64748B; }
        .back-link:hover { color: #334155; }
    </style>
</head>
<body>
    <header>
        <h1>修改密碼</h1>
        <p>醫師：<span th:text="${loggedInDoctorName}"></span></p>
    </header>

    <div th:if="${error}" class="alert-error" th:text="${error}"></div>
    <div th:if="${success}" class="alert-success" th:text="${success}"></div>

    <form th:action="@{/password}" method="post" th:object="${passwordForm}">
        <div class="form-group">
            <label for="oldPassword">舊密碼</label>
            <input type="password" id="oldPassword" th:field="*{oldPassword}" required />
        </div>
        <div class="form-group">
            <label for="newPassword">新密碼</label>
            <input type="password" id="newPassword" th:field="*{newPassword}" required />
        </div>
        <div class="form-group">
            <label for="confirmPassword">確認新密碼</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required />
        </div>
        <button type="submit">確認修改</button>
    </form>

    <a th:href="@{/dashboard}" class="back-link">← 回 Dashboard</a>
</body>
</html>
