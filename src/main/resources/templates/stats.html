<!DOCTYPE html>
<html lang="zh-Hant" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>統計資訊 - MiniClinic</title>
    <style>
        body { font-family: "Microsoft JhengHei", sans-serif; max-width: 960px; margin: 40px auto; padding: 0 20px; }
        h1 { color: #0F2443; border-bottom: 3px solid #14B8A6; padding-bottom: 8px; }
        nav { background: #0F2443; padding: 12px; border-radius: 8px; margin-bottom: 24px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { color: #5EEAD4; }
        .stat-card { background: #F8FAFC; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #14B8A6; }
        .stat-card h2 { margin-top: 0; color: #0F2443; font-size: 20px; }
        .stat-card p { font-size: 18px; font-weight: bold; margin: 10px 0; color: #0D9488; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; max-width: 400px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #E2E8F0; }
        th { background: #0F2443; color: white; }
        tr:hover { background: #F8FAFC; }
    </style>
</head>
<body>
    <nav>
        <a th:href="@{/}">首頁</a>
        <a th:href="@{/doctors}">醫師清單</a>
        <a th:href="@{/patients}">病歷資料</a>
        <a th:href="@{/appointment/new}">線上掛號</a>
        <a th:href="@{/appointments}">掛號記錄</a>
        <a th:href="@{/stats}">統計資訊</a>
    </nav>

    <h1>系統統計資訊</h1>

    <div class="stat-card">
        <h2>總數統計</h2>
        <p>醫師總數：<span th:text="${doctorCount}">0</span></p>
        <p>病患總數：<span th:text="${patientCount}">0</span></p>
        <p>掛號總數：<span th:text="${appointmentCount}">0</span></p>
    </div>

    <div class="stat-card">
        <h2>各科別掛號數</h2>
        <table>
            <thead>
                <tr>
                    <th>科別</th>
                    <th>掛號數</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="stat : ${deptStats}">
                    <td th:text="${stat[0]}">科別</td>
                    <td th:text="${stat[1]}">0</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
